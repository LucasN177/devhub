name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish -c Release -o release

    - name: Update base href
      run: sed -i 's/<base href="\/" \/>/<base href="\/devhub\/" \/>/' release/wwwroot/index.html

    # index.html changed after publish, so its integrity hash in the service worker manifest must be updated,
    # otherwise the service worker install fails
    - name: Update index.html hash in service worker manifest
      run: |
        export HASH="sha256-$(openssl dgst -sha256 -binary release/wwwroot/index.html | openssl base64 -A)"
        perl -0pi -e 's{"hash": "[^"]*"(,\s*"url": "index\.html")}{"hash": "$ENV{HASH}"$1}' release/wwwroot/service-worker-assets.js
        grep -qF "$HASH" release/wwwroot/service-worker-assets.js

    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: release/wwwroot

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write      # für Pages-Deploy
      id-token: write   # für OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
